[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "smiles2select"
version = "3.4.1"
description = "Multi-rule drug-likeness selector for large SMILES libraries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Adriano Marques Gonçalves", email = "adrianogoncalves.bio@gmail.com" },
]
maintainers = [{ name = "Adriano Marques Gonçalves" }]
keywords = ["cheminformatics", "drug-likeness", "rdkit", "virtual screening", "pareto"]
dependencies = [
    "rdkit==2026.3.5",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "psutil>=5.9",
    "PySide6>=6.5",
    "matplotlib>=3.7",
    "Pillow>=12.3.0",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.14.5", "pefile>=2023.2"]
parquet = ["pyarrow>=14.0"]
maps = ["umap-learn>=0.5"]
fastsearch = ["hnswlib>=0.8"]
build = ["pyinstaller>=6.0", "pefile>=2023.2"]
inference = ["onnxruntime>=1.18"]
train = [
    "torch>=2.10",
    "scikit-learn>=1.4",
    "onnx>=1.16",
    "onnxscript>=0.2",
    "onnxruntime>=1.18",
    "skl2onnx>=1.17",
    "protobuf<7",
]

[project.scripts]
smiles2select = "smiles2select.cli:main"
smiles2select-gui = "smiles2select.gui.app:main"
s2s-decision = "s2s_decision.cli:main"
s2s-decision-gui = "smiles2select.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smiles2select = [
    "profiles/builtins/*.json",
    "preparability/builtins/*.json",
    "assets/*.png",
    "assets/*.ico",
]
s2s_decision = [
    "bundled_models/*.md",
    "bundled_models/*.txt",
    "bundled_models/*/*.json",
    "bundled_models/*/*.onnx",
    "bundled_models/*/*.md",
    "bundled_models/*/references/*.json",
    "bundled_models/*/references/*.jsonl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# Rules are pinned explicitly: without a select list every ruff version applies
# its own defaults, so the same code passes locally and fails in CI.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C4"]
# Existing str+Enum classes retain their historical string representation in
# persisted decisions; StrEnum would change it.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["smiles2select", "s2s_decision"]
