name: release

# Builds the desktop bundles and attaches them to a GitHub release.
#
# Two build jobs rather than one because PyInstaller cannot cross-compile: the
# Windows bundle has to be produced on Windows and the Linux one on Linux.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PySide6 loads these at import time, so even the offscreen platform
      # needs them present before any GUI test can be collected.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SMILES2Select-windows
          - os: ubuntu-latest
            artifact: SMILES2Select-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      # Qt needs these X libraries present even for a headless import check.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Build bundle
        run: pyinstaller packaging/smiles2select.spec --noconfirm --clean

      - name: Check the bundle exists
        shell: bash
        run: test -d dist/SMILES2Select

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/SMILES2Select/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist SMILES2Select

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            SMILES2Select — seletor multirregra de drug-likeness.

            Autoria: Adriano Marques Gonçalves — Universidade de Araraquara (UNIARA).

            **Instaladores**
            - Windows: `SMILES2Select-windows.zip` — extrair e executar `SMILES2Select.exe`.
            - Linux: `SMILES2Select-linux.tar.gz` — extrair e executar `./SMILES2Select`.

            As regras de drug-likeness implementadas são heurísticas e não predizem
            biodisponibilidade, eficácia ou segurança.
