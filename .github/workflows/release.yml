name: release

# Builds the desktop bundles and attaches them to a GitHub release.
#
# Two build jobs rather than one because PyInstaller cannot cross-compile: the
# Windows bundle has to be produced on Windows and the Linux one on Linux.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PySide6 loads these at import time, so even the offscreen platform
      # needs them present before any GUI test can be collected.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev,train,parquet]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test Linux installer lifecycle
        run: bash tests/test_linux_installer.sh
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SMILES2Select-windows
          - os: ubuntu-latest
            artifact: SMILES2Select-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[build,inference]" pytest "scikit-learn>=1.4" "skl2onnx>=1.17" "protobuf<7"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes

      # Qt needs these X libraries present even for a headless import check.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Build bundle
        run: pyinstaller packaging/smiles2select.spec --noconfirm --clean

      - name: Check the bundle exists
        shell: bash
        run: test -d dist/SMILES2Select

      - name: Smoke test frozen Decision worker and ONNX inference
        env:
          S2S_FROZEN_BUNDLE: dist/SMILES2Select
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_frozen_inference.py tests/test_windows_bundle_verifier.py

      - name: Verify Windows native dependencies
        if: runner.os == 'Windows'
        run: python tools/verify_windows_bundle.py dist/SMILES2Select --manifest dist/SMILES2Select-manifest.json

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "import importlib.metadata as m; print(m.version('smiles2select'))"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\SMILES2Select" "/DOutputDir=$PWD\dist" packaging\smiles2select.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows installer lifecycle and installed inference
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist/SMILES2Select-Setup-*.exe)
          if ($installer.Count -ne 1) { throw "Expected exactly one Windows installer." }
          ./packaging/test_windows_installer.ps1 -Installer $installer[0].FullName

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/SMILES2Select/* -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist SMILES2Select
          version=$(python -c "import importlib.metadata as m; print(m.version('smiles2select'))")
          bash packaging/build_linux.sh dist/SMILES2Select "$version" dist
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Test installed Linux bundle
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/s2s-install-test/data"
          export XDG_BIN_HOME="$RUNNER_TEMP/s2s-install-test/bin"
          bash dist/SMILES2Select-Setup-*-linux-x86_64.run
          printf 'User-owned session sentinel' > "$RUNNER_TEMP/s2s-install-test/example.s2s.sqlite"
          bash dist/SMILES2Select-Setup-*-linux-x86_64.run
          export S2S_FROZEN_BUNDLE="$XDG_DATA_HOME/smiles2select"
          python -m pytest -q tests/test_frozen_inference.py
          bash "$XDG_DATA_HOME/smiles2select/uninstall.sh"
          test ! -e "$XDG_DATA_HOME/smiles2select"
          test ! -e "$XDG_BIN_HOME/smiles2select"
          test "$(cat "$RUNNER_TEMP/s2s-install-test/example.s2s.sqlite")" = 'User-owned session sentinel'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
            dist/SMILES2Select-Setup-*.exe
            dist/SMILES2Select-Setup-*-linux-x86_64.run
            dist/SMILES2Select-manifest.json
            dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare release notes and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/RELEASE_NOTES_${version}.md"
          if [[ -f "$notes" ]]; then
            cp "$notes" release-notes.md
          else
            printf 'See CHANGELOG.md for changes in %s.\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
          (cd artifacts && sha256sum -- * > "../SHA256SUMS-${GITHUB_REF_NAME}.txt")
          mv "SHA256SUMS-${GITHUB_REF_NAME}.txt" artifacts/
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
